<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Veículo</title>
</head>
<body>
    <h2>Cadastrar Novo Veículo</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Salvar Tudo" class="btn btn-primary">
    </form>
    <script>
        function configurarAnexos(inputId) {
            const input = document.getElementById(inputId);
            const acumulador = new DataTransfer();

            const lista = document.createElement('ul');
            lista.style.listStyle = 'none';
            lista.style.paddingLeft = '20px';
            (input.closest('p') || input.parentElement).insertAdjacentElement('afterend', lista);

            function desenharLista() {
                lista.innerHTML = '';
                Array.from(acumulador.files).forEach((arquivo, indice) => {
                    const item = document.createElement('li');
                    item.textContent = '📄 ' + arquivo.name + ' ';

                    const botao = document.createElement('button');
                    botao.type = 'button';
                    botao.textContent = '✕';
                    botao.onclick = () => remover(indice);

                    item.appendChild(botao);
                    lista.appendChild(item);
                });
            }

            function remover(indice) {
                acumulador.items.remove(indice);
                input.files = acumulador.files;
                desenharLista();
            }

            input.addEventListener('change', () => {
                Array.from(input.files).forEach(arquivo => {
                    const repetido = Array.from(acumulador.files).some(f =>
                        f.name === arquivo.name &&
                        f.size === arquivo.size &&
                        f.lastModified === arquivo.lastModified
                    );
                    if (!repetido) acumulador.items.add(arquivo);
                });
                input.files = acumulador.files;
                desenharLista();
            });
        }

        configurarAnexos('id_campo_mvs');
        configurarAnexos('id_campo_os');
        </script>
</body>
</html>
